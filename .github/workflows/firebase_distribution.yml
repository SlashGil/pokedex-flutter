name: Firebase App Distribution (Android & iOS)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform (android, ios, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      environment:
        description: 'Environment (debug, prod, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - prod

jobs:
  # ==========================================
  # ANDROID BUILD & DISTRIBUTE (DEBUG)
  # ==========================================
  build-distribute-android-debug:
    name: Android Debug Build & Distribute
    if: |
      github.event_name == 'push' || 
      (github.event.inputs.platform != 'ios' && (github.event.inputs.environment == 'both' || github.event.inputs.environment == 'debug'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_DEBUG }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Pokédex Android Debug Build (${{ github.sha }})"

  # ==========================================
  # ANDROID BUILD & DISTRIBUTE (PROD)
  # ==========================================
  build-distribute-android-prod:
    name: Android Prod Build & Distribute
    if: |
      github.event_name == 'push' || 
      (github.event.inputs.platform != 'ios' && (github.event.inputs.environment == 'both' || github.event.inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Pokédex Android Production Build (${{ github.sha }})"

  # ==========================================
  # IOS BUILD & DISTRIBUTE (DEBUG)
  # ==========================================
  build-distribute-ios-debug:
    name: iOS Debug Build & Distribute
    if: |
      github.event_name == 'push' || 
      (github.event.inputs.platform != 'android' && (github.event.inputs.environment == 'both' || github.event.inputs.environment == 'debug'))
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Debug)
        run: flutter build ipa --debug --export-method ad-hoc

      - name: Upload Debug IPA to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS_DEBUG }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: testers
          file: build/ios/ipa/pokedex.ipa
          releaseNotes: "Pokédex iOS Debug Build (${{ github.sha }})"

  # ==========================================
  # IOS BUILD & DISTRIBUTE (PROD)
  # ==========================================
  build-distribute-ios-prod:
    name: iOS Prod Build & Distribute
    if: |
      github.event_name == 'push' || 
      (github.event.inputs.platform != 'android' && (github.event.inputs.environment == 'both' || github.event.inputs.environment == 'prod'))
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Release)
        run: flutter build ipa --release --export-method ad-hoc

      - name: Upload Release IPA to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: testers
          file: build/ios/ipa/pokedex.ipa
          releaseNotes: "Pokédex iOS Production Build (${{ github.sha }})"
