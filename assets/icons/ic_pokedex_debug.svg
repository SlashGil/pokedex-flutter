<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo Técnico / Terminal de datos -->
  <rect width="512" height="512" fill="#0F172A" />

  <!-- Cuadrícula técnica base -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" stroke="#1E293B" stroke-width="4" />
  <path d="M 0 64 L 512 64 M 0 192 L 512 192 M 0 320 L 512 320 M 0 448 L 512 448 M 64 0 L 64 512 M 192 0 L 192 512 M 320 0 L 320 512 M 448 0 L 448 512" stroke="#1E293B" stroke-width="2" />

  <!-- Pokéball Wireframe principal -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="16, 12" />

  <!-- Banda central en wireframe -->
  <path d="M 76 256 L 200 256 M 312 256 L 436 256" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="8, 6" />

  <!-- Anillo central -->
  <circle cx="256" cy="256" r="56" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="12, 8" />

  <!-- Nodos de conexión (Representando el esquema de grafo de GraphQL) -->
  <circle cx="76" cy="256" r="10" fill="#E11D48" />
  <circle cx="436" cy="256" r="10" fill="#E11D48" />
  <circle cx="256" cy="76" r="10" fill="#E11D48" />
  <circle cx="256" cy="436" r="10" fill="#E11D48" />

  <circle cx="200" cy="256" r="8" fill="#FBBF24" />
  <circle cx="312" cy="256" r="8" fill="#FBBF24" />
  <circle cx="256" cy="200" r="8" fill="#FBBF24" />
  <circle cx="256" cy="312" r="8" fill="#FBBF24" />
  <circle cx="256" cy="256" r="12" fill="#E11D48" />

  <!-- Conexiones internas de los nodos -->
  <path d="M 256 76 L 200 256 L 256 436 M 256 76 L 312 256 L 256 436" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" />

  <!-- Cinta de Construcción / Debug -->
  <path d="M 0 0 L 160 0 L 0 160 Z" fill="#FACC15" />
  <path d="M 40 0 L 80 0 L 0 80 L 0 40 Z" fill="#000000" opacity="0.8"/>
  <path d="M 120 0 L 160 0 L 0 160 L 0 120 Z" fill="#000000" opacity="0.8"/>
</svg>