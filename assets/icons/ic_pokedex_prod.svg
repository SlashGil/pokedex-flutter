<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo clínico suave (Laboratorio) -->
  <rect width="512" height="512" fill="#F4F7F9" />

  <!-- Sombra base suave -->
  <circle cx="256" cy="264" r="180" fill="#E2E8F0" />

  <!-- Mitad superior de la Pokéball (Rojo vibrante) -->
  <path d="M 76 256 A 180 180 0 0 1 436 256 Z" fill="#FF4D4D" />

  <!-- Mitad inferior de la Pokéball (Blanco puro) -->
  <path d="M 76 256 A 180 180 0 0 0 436 256 Z" fill="#FFFFFF" />

  <!-- Borde exterior sólido -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2C3E50" stroke-width="20" />

  <!-- Banda central oscura -->
  <rect x="76" y="246" width="360" height="20" fill="#2C3E50" />

  <!-- Anillo central (Botón exterior) -->
  <circle cx="256" cy="256" r="56" fill="#FFFFFF" stroke="#2C3E50" stroke-width="20" />

  <!-- Lente central (Color cian indicando tecnología/escaneo) -->
  <circle cx="256" cy="256" r="24" fill="#00D2D3" />
</svg>